services:
  - type: web
    name: greencycle
    runtime: docker
    plan: free
    region: virginia
    branch: main

    rootDir: backend/greencycle

    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /up
    autoDeployTrigger: commit

    envVars:
      - key: APP_NAME
        value: GreenCycle

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        sync: false

      - key: APP_LOCALE
        value: en

      - key: APP_FALLBACK_LOCALE
        value: en

      - key: APP_FAKER_LOCALE
        value: en_US

      - key: APP_TIMEZONE
        value: America/Costa_Rica

      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_DATABASE
        value: neondb

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database

      - key: SESSION_SECURE_COOKIE
        value: "true"

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: sync

      - key: MAIL_MAILER
        value: log
